<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>建安國小足球隊｜近期賽程</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"><style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #1c2330;
    --muted: #6b7686;
    --line: #e3e7ee;
    --brand: #0b5cad;
    --brand-dark: #073f78;
    --accent: #f5b400;
    --win: #1a9b5b;
    --live: #e0412f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* 球隊標頭 */
  /* 草皮：深淺割草條紋 + 白色球場線 */
  header.hero {
    position: relative;
    overflow: hidden;
    color: #fff;
    padding: 28px 0 72px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.28) 100%),
      repeating-linear-gradient(90deg, #2f8f3a 0 70px, #3a9f45 70px 140px);
  }
  header.hero::before {
    /* 中圈 */
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 180px; height: 180px;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,.35);
    border-radius: 50%;
  }
  header.hero::after {
    /* 中線延伸到上下 */
    content: "";
    position: absolute;
    left: calc(50% - 1.5px); top: 0; bottom: 0;
    width: 3px;
    background: rgba(255,255,255,.35);
  }
  header.hero .team { position: relative; z-index: 1; }
  .team h1 { text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .team { display: flex; align-items: center; gap: 16px; }
  .crest {
    width: 64px; height: 64px; flex: none;
    border-radius: 50%;
    background: #fff; color: var(--brand);
    display: grid; place-items: center;
    font-weight: 800; font-size: 26px;
    border: 3px solid var(--accent);
  }
  .team h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
  .tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .tag {
    font-size: 12px; padding: 1px 8px; border-radius: 999px;
    background: rgba(255,255,255,.18);
  }

  /* 下一場倒數 */
  .next {
    position: relative;
    z-index: 2;
    margin-top: -52px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(16, 38, 74, .12);
    padding: 16px 18px;
  }
  .next-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .next-title { font-size: 18px; font-weight: 700; margin: 2px 0 10px; }
  .countdown { display: flex; gap: 10px; }
  .cd-box {
    flex: 1; text-align: center;
    background: var(--bg); border-radius: 10px; padding: 8px 0;
  }
  .cd-num { font-size: 26px; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
  .cd-unit { font-size: 12px; color: var(--muted); }

  .fb-live {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px; padding: 10px;
    background: #1877f2; color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 700; font-size: 15px;
  }
  .fb-live:hover { background: #0f63d1; }
  .fb-live.locked {
    background: #e9edf3; color: var(--muted); cursor: not-allowed; font-weight: 600;
  }
  .fb-live.locked .dot { background: #b7c0cc; animation: none; }
  .fb-live .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #ff4d4d;
    box-shadow: 0 0 0 0 rgba(255,77,77,.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,77,77,.7); }
    70%  { box-shadow: 0 0 0 8px rgba(255,77,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); }
  }

  /* 篩選列 */
  .filters { display: flex; gap: 8px; margin: 22px 0 6px; overflow-x: auto; }
  #ages { margin-bottom: 0; }
  #ages:empty { display: none; }
  #ages + #filters { margin-top: 10px; }
  .filters button.age.on { background: var(--accent); border-color: var(--accent); color: #3a2a00; font-weight: 700; }
  .pill.age { background: #1c2330; color: #fff; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
    white-space: nowrap;
  }
  .filters button.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* 日期分組 */
  .day { margin-top: 18px; }
  .day-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 4px 8px;
  }
  .day-date { font-weight: 800; font-size: 17px; }
  .day-event { font-size: 13px; color: var(--muted); }
  .wx-day {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: linear-gradient(90deg, #e8f3ff, #f4f9ff);
    border: 1px solid #d6e7fb; border-radius: 10px;
    padding: 8px 12px; margin-bottom: 10px; font-size: 14px;
  }
  .wx-day .ico { font-size: 24px; line-height: 1; }
  .wx-day .desc { font-weight: 700; }
  .wx-day .temp { font-variant-numeric: tabular-nums; }
  .wx-day .rain { color: var(--brand); }
  .wx-day.na { background: var(--card); border-color: var(--line); color: var(--muted); font-size: 13px; }
  .pill.wx { background: #e8f3ff; color: #0b4a8a; }
  .venue {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px;
    padding: 0 4px 8px;
  }
  .venue small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .venue span { margin-left: auto; color: var(--brand); font-size: 12px; font-weight: 600; }

  /* 比賽卡片 */
  .match {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 12px 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .match.done { opacity: .55; }
  .match.done.scored { opacity: 1; background: #fafbfc; }
  .score {
    font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
    background: var(--ink); color: #fff; border-radius: 6px; padding: 0 8px;
  }
  .pk { font-size: 11px; color: var(--muted); font-weight: 700; }
  .pill.res { font-size: 12px; padding: 0 9px; }
  .pill.win  { background: var(--win); color: #fff; }
  .pill.lose { background: var(--live); color: #fff; }
  .pill.draw { background: #8a94a3; color: #fff; }
  .tag.record { background: var(--accent); color: #3a2a00; font-weight: 700; }
  .match.is-next { border: 2px solid var(--accent); }
  .time { text-align: center; }
  .time b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .time span { font-size: 11px; color: var(--muted); }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .pill { font-size: 11px; padding: 0 7px; border-radius: 6px; background: #eef3fa; color: var(--brand); font-weight: 600; }
  .pill.stage { background: #fff4d6; color: #8a6400; }
  .pill.live { background: var(--live); color: #fff; }
  .pill.path { background: var(--brand); color: #fff; }
  .match.ko.on-path { border: 1.5px dashed var(--brand); background: #f4f8fe; }
  .vs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 16px; }
  .vs .t { font-weight: 600; }
  .vs .t.us { color: var(--brand); font-weight: 800; }
  .vs .x { color: var(--muted); font-size: 12px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cal {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    font-size: 12px; padding: 6px 8px; cursor: pointer; color: var(--muted);
  }
  .cal:hover { color: var(--brand); border-color: var(--brand); }

  .match.ko { background: #fafbfd; border-style: dashed; }

  .actions { text-align: center; margin: 22px 0 8px; }
  .btn {
    display: inline-block; background: var(--brand); color: #fff; border: 0;
    padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0 40px; }

  @media (max-width: 480px) {
    .match { grid-template-columns: 54px 1fr; }
    .cal { grid-column: 2; justify-self: start; }
    .cd-num { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap team">
    <div class="crest">建</div>
    <div>
      <h1>建安國小足球隊</h1>
      <div class="tags">
        <span class="tag" id="age-tag"></span>
        <span class="tag">台北・大安</span>
        <span class="tag">2026 秋季</span>
        <span class="tag record" id="record" hidden></span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="next" id="next">
    <div class="next-label">下一場比賽</div>
    <div class="next-title" id="next-title">—</div>
    <div class="countdown" id="countdown">
      <div class="cd-box"><div class="cd-num" id="cd-d">0</div><div class="cd-unit">天</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-h">0</div><div class="cd-unit">時</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-m">0</div><div class="cd-unit">分</div></div>
      <div class="cd-box"><div class="cd-num" id="cd-s">0</div><div class="cd-unit">秒</div></div>
    </div>
    <a class="fb-live locked" id="fb-live" target="_blank" rel="noopener" aria-disabled="true">
      <span class="dot"></span><span id="fb-text">Facebook 直播</span>
    </a>
  </section>

  <nav class="filters" id="ages"></nav>
  <nav class="filters" id="filters"></nav>

  <div id="list"></div>

  <div class="actions">
    <button class="btn" id="cal-all">📅 全部加入行事曆</button>
  </div>
</main>

<footer>
  建安國小足球隊・賽程如有異動以主辦單位公告為準<br>
  天氣預報依各場地位置，資料來源 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>，每 30 分鐘更新
</footer>

<script>
  const US = "建安國小";

  // 賽程資料：要新增比賽就加在這裡
  // start / end 用台北時間 "YYYY-MM-DDTHH:MM"
  // 比分：score: [客隊, 主隊]（跟畫面左客右主同順序），PK 大戰另加 pk: [客隊, 主隊]
  //       淘汰賽確定對手後，在該場加 home / away 就會顯示隊名
  // 年齡組別：賽事的 age 是預設值；同賽事不同組別時，在該場比賽加 age: "U12" 覆蓋
  const EVENTS = {
    tes:  { name: "TES CUP",        age: "U10", venue: "台北歐洲學校 小學部", addr: "台北市北投區文林北路 727 號", lat: 25.1008, lon: 121.5196 },
    daan: { name: "2026 秋季大安盃", age: "U10", venue: "華中露營場",         addr: "台北市萬華區華中河濱公園",   lat: 25.0141, lon: 121.4970 },
  };

  const MATCHES = [
    { ev: "tes",  start: "2026-11-14T08:25", end: "2026-11-14T09:05", home: "明德國小", homeEn: "MDES", away: US, pitch: "Pitch 2", stage: "小組賽" },
    { ev: "tes",  start: "2026-11-14T09:40", end: "2026-11-14T10:20", home: US, away: "忠義國小", awayEn: "ZYES", pitch: "Pitch 2", stage: "小組賽" },
    { ev: "tes",  start: "2026-11-14T10:55", end: "2026-11-14T11:35", home: "百齡國小", homeEn: "BLES", away: US, pitch: "Pitch 2", stage: "小組賽" },
    { ev: "tes",  start: "2026-11-14T11:45", end: "2026-11-14T12:10", home: US, away: "歐小", awayEn: "TES", pitch: "Pitch 2", stage: "小組賽" },
    { ev: "tes",  start: "2026-11-14T12:15", end: "2026-11-14T12:35", ko: "四強準決賽", sub: "Semi-Final・依小組名次而定", pitch: "Pitch 1 / Pitch 2", stage: "準決賽" },
    { ev: "tes",  start: "2026-11-14T12:40", end: "2026-11-14T13:00", ko: "季軍賽", sub: "3rd / 4th Place", pitch: "Pitch 1", stage: "季軍賽" },
    { ev: "tes",  start: "2026-11-14T12:40", end: "2026-11-14T13:00", ko: "冠軍賽", sub: "FINAL", pitch: "Pitch 2", stage: "冠軍賽" },
    { ev: "tes",  start: "2026-11-14T13:00", end: "2026-11-14T13:20", ko: "頒獎典禮", sub: "PRESENTATIONS", pitch: "", stage: "頒獎" },
    { ev: "daan", start: "2026-11-21T13:00", end: "2026-11-21T13:50", home: US, away: "大安國小", pitch: "", stage: "八強賽 #57", note: "勝隊晉級 12/5 準決賽 #69" },
    { ev: "daan", start: "2026-12-05T09:00", end: "2026-12-05T09:50", ko: "準決賽 #61", sub: "52場勝 vs 53場勝・場次 52 獲勝晉級", pitch: "A 場地", stage: "準決賽" },
    { ev: "daan", start: "2026-12-05T09:00", end: "2026-12-05T09:50", ko: "準決賽 #69", sub: "57場勝 vs 58場勝・場次 57 獲勝晉級", pitch: "B 場地", stage: "準決賽", path: true },
    { ev: "daan", start: "2026-12-05T12:40", end: "2026-12-05T13:30", ko: "季軍賽 #65", sub: "61場敗 vs 69場敗・爭奪第 3 名", pitch: "A 場地", stage: "季軍賽" },
    { ev: "daan", start: "2026-12-05T12:40", end: "2026-12-05T13:30", ko: "冠軍賽 #73", sub: "61場勝 vs 69場勝・爭奪冠軍", pitch: "B 場地", stage: "冠軍賽" },
  ];

  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const toDate = s => new Date(s + ":00+08:00");
  const pad = n => String(n).padStart(2, "0");

  function fmtTime(d) {
    const tw = new Date(d.getTime() + 8 * 3600e3);
    return pad(tw.getUTCHours()) + ":" + pad(tw.getUTCMinutes());
  }
  function fmtDay(s) {
    const [y, m, d] = s.slice(0, 10).split("-").map(Number);
    const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return `${m}/${d}（${WEEK[wd]}）`;
  }
  const ageOf = m => m.age || EVENTS[m.ev].age;
  const AGES = [...new Set(MATCHES.map(ageOf))].sort((a, b) => parseInt(b.slice(1)) - parseInt(a.slice(1)));

  const hasTeams = m => m.home && m.away;
  // 建安的勝負："勝" / "負" / "和"；沒比分或建安沒上場則回傳 null
  function result(m) {
    if (!m.score || !hasTeams(m) || (m.home !== US && m.away !== US)) return null;
    const us = m.away === US ? 0 : 1, them = 1 - us;
    const [a, b] = m.pk && m.score[0] === m.score[1] ? [m.pk[us], m.pk[them]] : [m.score[us], m.score[them]];
    return a > b ? "勝" : a < b ? "負" : "和";
  }

  function title(m) {
    const vs = hasTeams(m) ? `${m.away} vs ${m.home}` : m.ko;
    const sc = m.score ? `（${m.score[0]}:${m.score[1]}${m.pk ? ` PK ${m.pk[0]}:${m.pk[1]}` : ""}）` : "";
    return `${ageOf(m)} ${EVENTS[m.ev].name}｜${m.ko && hasTeams(m) ? m.ko + " " : ""}${vs}${sc}`;
  }
  function teamHtml(name, en) {
    const cls = name === US ? "t us" : "t";
    return `<span class="${cls}">${name}${en ? ` <small style="color:#9aa3b0">${en}</small>` : ""}</span>`;
  }

  let filter = "all";   // 賽事
  let ageFilter = "all"; // 年齡組別
  const visible = m => (filter === "all" || m.ev === filter) && (ageFilter === "all" || ageOf(m) === ageFilter);

  function renderFilters() {
    document.getElementById("age-tag").textContent = AGES.join("・");
    // 戰績（依目前組別）
    const rs = MATCHES.filter(m => ageFilter === "all" || ageOf(m) === ageFilter).map(result).filter(Boolean);
    const rec = document.getElementById("record");
    rec.hidden = !rs.length;
    rec.textContent = `已賽 ${rs.length} 場：${rs.filter(r => r === "勝").length} 勝 ${rs.filter(r => r === "和").length} 和 ${rs.filter(r => r === "負").length} 負`;
    // 只有一個組別時不顯示年齡篩選
    document.getElementById("ages").innerHTML = AGES.length < 2 ? "" :
      [["all", "全部組別"], ...AGES.map(a => [a, a])].map(([k, t]) =>
        `<button class="age${k === ageFilter ? " on" : ""}" data-a="${k}">${t}</button>`).join("");
    // 賽事按鈕只列目前組別有的賽事
    const evs = Object.keys(EVENTS).filter(k => MATCHES.some(m => m.ev === k && (ageFilter === "all" || ageOf(m) === ageFilter)));
    if (filter !== "all" && !evs.includes(filter)) filter = "all";
    document.getElementById("filters").innerHTML =
      [["all", "全部賽事"], ...evs.map(k => [k, EVENTS[k].name])].map(([k, t]) =>
        `<button class="${k === filter ? "on" : ""}" data-f="${k}">${t}</button>`).join("");
  }

  // 天氣預報（Open-Meteo，免金鑰，最多預報 16 天）
  // 每個賽事依場地座標各抓一份
  const wxUrl = ev => `https://api.open-meteo.com/v1/forecast?latitude=${ev.lat}&longitude=${ev.lon}`
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&hourly=temperature_2m,precipitation_probability,weather_code"
    + "&timezone=Asia%2FTaipei&forecast_days=16";
  const WX = {}; // WX[賽事 key]：undefined=載入中, {error:true}=失敗

  const WX_CODE = [
    [[0], "☀️", "晴"],
    [[1], "🌤️", "晴時多雲"],
    [[2], "⛅", "多雲"],
    [[3], "☁️", "陰"],
    [[45, 48], "🌫️", "有霧"],
    [[51, 53, 55, 56, 57], "🌦️", "毛毛雨"],
    [[61, 63, 66], "🌧️", "下雨"],
    [[65, 67], "🌧️", "大雨"],
    [[80, 81, 82], "🌦️", "陣雨"],
    [[95, 96, 99], "⛈️", "雷雨"],
    [[71, 73, 75, 77, 85, 86], "🌨️", "下雪"],
  ];
  const wxInfo = code => {
    const hit = WX_CODE.find(([codes]) => codes.includes(code));
    return hit ? { ico: hit[1], desc: hit[2] } : { ico: "🌡️", desc: "—" };
  };

  async function loadWeather() {
    await Promise.all(Object.entries(EVENTS).map(async ([key, ev]) => {
      WX[key] = await fetchWeather(ev);
    }));
    render();
  }

  async function fetchWeather(ev) {
    try {
      const j = await (await fetch(wxUrl(ev))).json();
      const daily = {}, hourly = {};
      j.daily.time.forEach((d, i) => daily[d] = {
        code: j.daily.weather_code[i],
        max: j.daily.temperature_2m_max[i],
        min: j.daily.temperature_2m_min[i],
        pop: j.daily.precipitation_probability_max[i],
      });
      j.hourly.time.forEach((t, i) => hourly[t] = {
        code: j.hourly.weather_code[i],
        temp: j.hourly.temperature_2m[i],
        pop: j.hourly.precipitation_probability[i],
      });
      return { daily, hourly };
    } catch (e) {
      return { error: true };
    }
  }

  function wxDayHtml(day, evKey) {
    const wx = WX[evKey];
    if (!wx) return `<div class="wx-day na">天氣預報載入中…</div>`;
    if (wx.error) return `<div class="wx-day na">天氣預報暫時無法取得</div>`;
    const w = wx.daily[day];
    if (!w) return `<div class="wx-day na">天氣預報尚未發布（賽前 16 天內才會顯示）</div>`;
    const i = wxInfo(w.code);
    return `<div class="wx-day">
      <span class="ico">${i.ico}</span>
      <span class="desc">${i.desc}</span>
      <span class="temp">${Math.round(w.min)}–${Math.round(w.max)}°C</span>
      <span class="rain">☔ 降雨 ${w.pop ?? "—"}%</span>
    </div>`;
  }

  function wxMatchHtml(m) {
    const wx = WX[m.ev];
    if (!wx || wx.error) return "";
    const w = wx.hourly[m.start.slice(0, 13) + ":00"];
    if (!w) return "";
    return `<span class="pill wx">${wxInfo(w.code).ico} ${Math.round(w.temp)}° ☔${w.pop ?? "—"}%</span>`;
  }

  function render() {
    const now = Date.now();
    const list = document.getElementById("list");
    const shown = MATCHES.filter(visible);
    const next = findNext(now);

    // 依日期分組
    const groups = {};
    shown.forEach(m => (groups[m.start.slice(0, 10) + "|" + m.ev] ??= []).push(m));

    list.innerHTML = Object.entries(groups).map(([key, ms]) => {
      const day = key.slice(0, 10);
      const ev = EVENTS[ms[0].ev];
      const map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ev.venue + " " + ev.addr);
      return `
        <section class="day">
          <div class="day-head">
            <span class="day-date">${fmtDay(day)}</span>
            <span class="day-event">${ev.name}</span>
          </div>
          <a class="venue" href="${map}" target="_blank" rel="noopener">📍 ${ev.venue}<small>${ev.addr}</small><span>地圖 ›</span></a>
          ${wxDayHtml(day, ms[0].ev)}
          ${ms.map(m => {
            const s = toDate(m.start), e = toDate(m.end);
            const done = e < now, live = s <= now && now < e;
            const cls = ["match", m.ko && !hasTeams(m) ? "ko" : "", done ? "done" : "", m.score ? "scored" : "", m === next ? "is-next" : "", m.path ? "on-path" : ""].join(" ");
            const idx = MATCHES.indexOf(m);
            const res = result(m);
            const mid = m.score
              ? `<span class="score">${m.score[0]} : ${m.score[1]}</span>${m.pk ? `<span class="pk">PK ${m.pk[0]} : ${m.pk[1]}</span>` : ""}`
              : `<span class="x">vs</span>`;
            const side = m.home === US ? "主隊" : m.away === US ? "客隊" : "";
            const body = !hasTeams(m)
              ? `<div class="vs"><span class="t">${m.ko}</span></div><div class="sub">${m.sub}</div>`
              : `<div class="vs">${teamHtml(m.away, m.awayEn)}${mid}${teamHtml(m.home, m.homeEn)}</div>
                 <div class="sub">${[m.ko, side, m.ko ? "" : m.pitch, m.note].filter(Boolean).join("・")}</div>`;
            return `
              <div class="${cls}">
                <div class="time"><b>${fmtTime(s)}</b><span>${m.ev === "daan" ? "至 " + fmtTime(e) : ""}</span></div>
                <div>
                  <div class="meta">
                    <span class="pill age">${ageOf(m)}</span>
                    <span class="pill stage">${m.stage}</span>
                    ${m.ko && m.pitch ? `<span class="pill">${m.pitch}</span>` : ""}
                    ${done || m.score ? "" : wxMatchHtml(m)}
                    ${m.path ? `<span class="pill path">建安晉級路線</span>` : ""}
                    ${live ? `<span class="pill live">進行中</span>` : ""}
                    ${res ? `<span class="pill res ${{勝: "win", 負: "lose", 和: "draw"}[res]}">${res}</span>` : done ? `<span class="pill">已結束</span>` : ""}
                  </div>
                  ${body}
                </div>
                ${m.stage === "頒獎" ? "" : `<button class="cal" data-i="${idx}">＋行事曆</button>`}
              </div>`;
          }).join("")}
        </section>`;
    }).join("");
  }

  // 下一場：還沒結束的比賽（頒獎不算）
  const findNext = (now, all) => MATCHES.find(m => m.stage !== "頒獎" && !m.score && toDate(m.end) > now && (all || visible(m)));
  const label = m => hasTeams(m) ? `${m.ko ? m.ko + " " : ""}${m.away} vs ${m.home}` : `${m.ko}（${m.sub}）`;

  // 直播按鈕：比賽開始前 LIVE_EARLY_MIN 分鐘到比賽結束才開放
  const LIVE_EARLY_MIN = 15;
  const LIVE_URL = "https://www.facebook.com/groups/611575027521750";
  function updateLive(now) {
    const btn = document.getElementById("fb-live");
    const txt = document.getElementById("fb-text");
    const on = MATCHES.some(m =>
      toDate(m.start) - LIVE_EARLY_MIN * 60e3 <= now && now < toDate(m.end));
    btn.classList.toggle("locked", !on);
    if (on) {
      btn.href = LIVE_URL;
      btn.removeAttribute("aria-disabled");
      txt.textContent = "Facebook 直播中・點我看比賽";
      return;
    }
    btn.removeAttribute("href");
    btn.setAttribute("aria-disabled", "true");
    const next = findNext(now, true);
    if (!next) { txt.textContent = "本季直播已結束"; return; }
    const open = new Date(toDate(next.start) - LIVE_EARLY_MIN * 60e3);
    txt.textContent = `直播 ${fmtDay(next.start)} ${fmtTime(open)} 開放`;
  }

  // 倒數計時
  function tick() {
    const now = Date.now();
    const next = findNext(now);
    updateLive(now);
    const t = document.getElementById("next-title");
    if (!next) {
      t.textContent = "本季賽程已全部結束，謝謝大家的加油！";
      document.getElementById("countdown").style.display = "none";
      return;
    }
    const s = toDate(next.start);
    t.textContent = `${fmtDay(next.start)} ${fmtTime(s)}　${ageOf(next)}｜${label(next)}`;
    let diff = Math.max(0, s - now) / 1000;
    if (diff === 0) { t.textContent += "（比賽進行中）"; }
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600);  diff -= h * 3600;
    const mi = Math.floor(diff / 60);
    const se = Math.floor(diff - mi * 60);
    document.getElementById("cd-d").textContent = d;
    document.getElementById("cd-h").textContent = pad(h);
    document.getElementById("cd-m").textContent = pad(mi);
    document.getElementById("cd-s").textContent = pad(se);
  }

  // 產生 .ics 行事曆檔
  function icsStamp(d) {
    return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  }
  function makeIcs(ms) {
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//JianAn Football//TW", "CALSCALE:GREGORIAN"];
    ms.forEach((m, i) => {
      lines.push(
        "BEGIN:VEVENT",
        `UID:jianan-${m.start}-${i}@jianan`,
        `DTSTAMP:${icsStamp(new Date())}`,
        `DTSTART:${icsStamp(toDate(m.start))}`,
        `DTEND:${icsStamp(toDate(m.end))}`,
        `SUMMARY:${title(m)}`,
        `LOCATION:${EVENTS[m.ev].venue}${m.pitch ? " " + m.pitch : ""}\\, ${EVENTS[m.ev].addr}`,
        "BEGIN:VALARM", "TRIGGER:-PT60M", "ACTION:DISPLAY", `DESCRIPTION:${title(m)}`, "END:VALARM",
        "END:VEVENT"
      );
    });
    lines.push("END:VCALENDAR");
    return lines.filter(Boolean).join("\r\n");
  }
  function download(name, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/calendar;charset=utf-8" }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    filter = b.dataset.f;
    renderFilters(); render(); tick();
  });
  document.getElementById("ages").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    ageFilter = b.dataset.a;
    renderFilters(); render(); tick();
  });
  document.getElementById("list").addEventListener("click", e => {
    const b = e.target.closest(".cal");
    if (!b) return;
    const m = MATCHES[b.dataset.i];
    download(`建安_${m.start.slice(5, 10)}_${fmtTime(toDate(m.start)).replace(":", "")}.ics`, makeIcs([m]));
  });
  document.getElementById("cal-all").addEventListener("click", () => {
    download("建安國小_賽程.ics", makeIcs(MATCHES.filter(m => !m.ko && visible(m))));
  });

  renderFilters();
  render();
  tick();
  loadWeather();
  setInterval(tick, 1000);
  setInterval(render, 60000);
  setInterval(loadWeather, 30 * 60000);
</script>
</body>
</html>
